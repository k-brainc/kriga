<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 | 만족도조사 · 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#14171D;
    --surface:#1D212B;
    --surface-2:#232833;
    --text:#EDE7D8;
    --text-soft:#B7AF9C;
    --text-faint:#7C7669;
    --brass:#D4AF5A;
    --brass-deep:#E9C97E;
    --line:#2B303B;

    --dance:#E08AA6;
    --art:#7FC17A;
    --music:#7FB0DD;
    --trad:#E08A5E;

    --accent:var(--brass);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    color:var(--text);
    word-break:keep-all;
    overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }

  .shell{
    max-width:1200px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  .kicker{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--text-faint);
  }

  .setup-banner{
    margin:0 0 28px;
    padding:14px 18px;
    background:#3A3120;
    border:1px solid var(--brass);
    border-radius:6px;
    color:var(--brass-deep);
    font-size:13.5px;
    line-height:1.6;
  }

  /* ── 분야 선택 화면 ─────────────────────────── */
  .picker h1{
    font-weight:800;
    font-size:clamp(44px,5.6vw,72px);
    line-height:1.18;
    margin:16px 0 0;
  }
  .picker .lede{
    color:var(--text-soft);
    font-size:15.5px;
    line-height:1.75;
    max-width:46ch;
    margin:20px 0 44px;
  }
  .picks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }
  @media(max-width:900px){ .picks{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:520px){ .picks{ grid-template-columns:1fr; gap:14px; } }

  .pick{
    position:relative;
    display:block;
    width:100%;
    padding:0;
    text-align:left;
    border-radius:14px;
    overflow:hidden;
    aspect-ratio:3/4;
    background:
      radial-gradient(120% 140% at 15% 0%, color-mix(in srgb, var(--accent) 55%, white) 0%, transparent 55%),
      linear-gradient(150deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 50%, #0C0E12) 100%);
    box-shadow:0 14px 32px rgba(0,0,0,.4);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  @media(max-width:520px){ .pick{ aspect-ratio:16/9; } }
  .pick:hover{ transform:translateY(-3px); box-shadow:0 22px 44px rgba(0,0,0,.5); }
  .pick img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:grayscale(.85) contrast(1.05) brightness(.82);
  }
  .pick .tint{
    position:absolute; inset:0;
    background:var(--accent);
    mix-blend-mode:color;
    opacity:.9;
  }
  .pick .scrim{
    position:absolute; left:0; right:0; bottom:0;
    height:70%;
    background:linear-gradient(180deg, transparent, rgba(12,16,24,.78));
  }
  .pick .foot{
    position:absolute;
    left:18px; right:18px; bottom:16px;
  }
  .pick h2{
    font-size:24px;
    font-weight:700;
    margin:0;
    color:#fff;
  }
  .pick .count{
    display:block;
    margin-top:6px;
    font-size:12.5px;
    color:rgba(255,255,255,.72);
  }

  /* ── 분야 상세 화면 ─────────────────────────── */
  .browser{
    display:grid;
    grid-template-columns:212px 1fr;
    gap:44px;
    align-items:start;
  }
  @media(max-width:820px){
    .browser{ grid-template-columns:1fr; gap:24px; }
  }

  .rail{ position:sticky; top:56px; }
  @media(max-width:820px){ .rail{ position:static; } }

  .rail .home{
    display:inline-flex;
    text-decoration:none;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--text-faint);
    padding:4px 0;
  }
  .rail .home:hover{ color:var(--text); }
  .rail nav{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  @media(max-width:820px){
    .rail nav{
      flex-direction:row;
      gap:8px;
      overflow-x:auto;
      padding-bottom:4px;
      margin-top:16px;
    }
  }
  .rail-item{
    display:flex;
    text-decoration:none;
    align-items:center;
    gap:10px;
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    font-size:14.5px;
    font-weight:600;
    color:var(--text-soft);
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .rail-item .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:currentColor;
    opacity:.55;
    flex:none;
  }
  .rail-item:hover{ background:var(--surface); color:var(--text); }
  .rail-item.is-active{
    background:var(--surface);
    color:var(--text);
  }
  .rail-item.is-active .dot{ opacity:1; }

  .panel-head h1{
    font-size:clamp(32px,4vw,44px);
    font-weight:800;
    margin:0;
    line-height:1.2;
  }
  .panel-head .sub{
    margin:10px 0 0;
    color:var(--text-faint);
    font-size:13.5px;
  }

  .tabs{
    display:flex;
    gap:26px;
    margin:30px 0 0;
    border-bottom:1px solid var(--line);
  }
  .tab{
    position:relative;
    padding:0 2px 13px;
    font-size:15px;
    font-weight:600;
    color:var(--text-faint);
    transition:color .15s ease;
  }
  .tab:hover{ color:var(--text-soft); }
  .tab.is-active{ color:var(--text); }
  .tab.is-active::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--accent);
  }
  .tab .n{
    margin-left:7px;
    font-size:12px;
    font-weight:600;
    color:var(--text-faint);
  }
  .tab.is-active .n{ color:var(--accent); }

  .items{ margin-top:4px; }
  .item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 2px;
    border-bottom:1px solid var(--line);
  }
  .item-name{
    flex:1;
    min-width:0;
    font-size:15.5px;
    font-weight:600;
    line-height:1.45;
  }
  a.item{ text-decoration:none; transition:padding-left .15s ease; }
  a.item:hover{ padding-left:8px; }
  a.item:hover .go{ color:var(--accent); }
  .go{
    font-size:13.5px;
    font-weight:600;
    color:var(--text-faint);
    white-space:nowrap;
    transition:color .15s ease;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:700;
    padding:3px 10px 3px 8px;
    border-radius:999px;
    background:var(--surface-2);
    color:var(--text-soft);
    white-space:nowrap;
    flex:none;
  }
  .status-pill::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
  }
  .status-pill.is-open::before{ background:#5FBF4A; }
  .status-pill.is-closed::before{ background:#D9694A; }

  .doc-actions{ display:flex; gap:8px; flex:none; }
  .doc-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:7px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    color:var(--text-soft);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .doc-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .doc-btn.download{
    background:rgba(255,255,255,.06);
    color:var(--text);
  }
  .doc-btn.download:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--bg);
  }
  .doc-btn .ico{ font-size:11px; line-height:1; }

  @media(max-width:520px){
    .item{ flex-wrap:wrap; gap:10px; padding:16px 2px; }
    .item-name{ flex:1 0 100%; }
    a.item:hover{ padding-left:0; }
  }

  .empty{
    padding:56px 4px;
    color:var(--text-faint);
    font-size:14px;
    line-height:1.7;
  }
  .loading{ padding:60px 4px; color:var(--text-faint); font-size:14px; }

  .updated{
    margin-top:40px;
    color:var(--text-faint);
    font-size:12.5px;
  }
</style>
</head>
<body>

<div class="shell">
  <div id="setupBanner" class="setup-banner" style="display:none;"></div>
  <div id="view"><div class="loading">불러오는 중…</div></div>
</div>

<script>
/* ============================================================
   설정 (CONFIG)
   구글시트 → Apps Script 웹앱 → 이 페이지 순서로 데이터가 흘러갑니다.

   시트 형식 (1행은 머리글, 2행부터 한 줄이 버튼 하나):
   ┌─────────────────────────┬──────────────┬──────────────┬──────────────┬──────────────┐
   │ A 항목                   │ B 무용        │ C 미술        │ D 음악        │ E 전통예술     │
   ├─────────────────────────┼──────────────┼──────────────┼──────────────┼──────────────┤
   │ 웹 리플렛                 │ https://…    │ https://…    │ https://…    │ https://…    │
   │ 만족도 조사 문항           │ https://forms│ https://forms│ https://forms│ https://forms│
   │ 만족도 조사 문항 상태       │ 진행          │ 마감          │ 진행          │              │
   │ 웹 만족도 분석 보고서       │ https://…    │              │ https://…    │ https://…    │
   │ 리플렛                    │ https://drive│ https://drive│ https://drive│ https://drive│
   │ 마스터클래스 안내지         │              │              │ https://drive│              │
   │ 만족도 조사 분석 보고서     │ https://drive│ https://drive│ https://drive│ https://drive│
   └─────────────────────────┴──────────────┴──────────────┴──────────────┴──────────────┘

   - A열 "항목"에 적은 글자가 그대로 버튼 이름이 됩니다.
   - 칸이 비어 있으면 그 분야에는 그 버튼이 생기지 않습니다.
   - 구글 드라이브 파일 주소는 "문서파일" 탭에 [보기] [다운로드]로,
     그 밖의 주소는 "온라인" 탭에 열기 버튼으로 자동 분류됩니다.
   - 항목 이름이 "○○ 상태"인 줄은 버튼이 되지 않고, 같은 이름의 "○○" 버튼에
     진행/마감 배지를 붙입니다. (예: "만족도 조사 문항 상태")
   - 줄을 추가하면 버튼이 늘고, 지우면 사라집니다. 순서도 시트 줄 순서를 따릅니다.
   ============================================================ */
  const LINK_API_URL = 'https://script.google.com/macros/s/AKfycbyATIckZ-DIO3wxiVxXoO3l5CreV8Y4JO45eCmi0m4OHHQ993D6ed5OCd2N-pVkdEvDHg/exec';

/* ============================================================ */

  const FIELD_META = {
    '무용':  { key:'dance', color:'var(--dance)', order:1, image:'https://k-brainc.github.io/kriga/img/b.webp' },
    '미술':  { key:'art',   color:'var(--art)',   order:2, image:'https://k-brainc.github.io/kriga/img/a.jpg' },
    '음악':  { key:'music', color:'var(--music)', order:3, image:'https://k-brainc.github.io/kriga/img/m.jpg' },
    '전통예술': { key:'trad', color:'var(--trad)', order:4, image:'https://k-brainc.github.io/kriga/img/t.webp' },
  };

  const FIELD_ALIASES = {
    '무용':'무용', '발레':'무용', 'dance':'무용', 'ballet':'무용',
    '미술':'미술', '시각예술':'미술', 'art':'미술', 'visual arts':'미술',
    '음악':'음악', 'music':'음악',
    '전통예술':'전통예술', '전통':'전통예술', 'traditional arts':'전통예술', 'traditional':'전통예술',
  };

  /* 시트를 아예 불러오지 못했을 때만 쓰는 예비 목록입니다.
     시트가 정상이면 이 값은 화면에 나오지 않습니다. */
  const FALLBACK_ROWS = [
    ['무용','리플렛','14NkDIaKCOnEvOv0ZapOYobRwiRLCgbUn'],
    ['무용','만족도 조사 분석 보고서','1NkOKKWRjnKESPyCF5gxJEHGGDI6oSJzb'],
    ['미술','리플렛','1Al1Do0ng8LqXtPxx_YpxKWiX7x-MwHiu'],
    ['미술','만족도 조사 분석 보고서','1tM_O3wf1XOUernl9tBMEtCS9JbBkpc42'],
    ['음악','리플렛','1Uqj0GWgrQyHuJlO-sloi_R54MTQcDPsp'],
    ['음악','마스터클래스 안내지','1_zXAlnpoKqUhDXFwWChFc-Zbk-706h3B'],
    ['음악','연주회 안내지','1ZNlxJr_31me-RnpvMgB7-cW1-55vakYT'],
    ['음악','만족도 조사 분석 보고서','1DWH01hbmnI6Q5_csZejIX8OytWyKLQeX'],
    ['전통예술','리플렛','1_e6n1CtpSQiCdyLDXufNpcAALEvSw6ZT'],
    ['전통예술','만족도 조사 분석 보고서','1sdaGmI84anC8sR43WvQK_x8KNJ5NuZwv'],
  ].map(r => ({
    field:r[0], title:r[1],
    url:'https://drive.google.com/file/d/' + r[2] + '/view?usp=sharing',
    status:'',
  }));

  let ROWS = [];

  /* ── 도구 ────────────────────────────────── */
  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function normalizeField(raw){
    if(!raw) return null;
    const t = String(raw).trim();
    if(FIELD_ALIASES[t]) return FIELD_ALIASES[t];
    const lower = t.toLowerCase();
    return FIELD_ALIASES[lower] || null;
  }

  function statusOf(raw){
    if(raw === undefined || raw === null || String(raw).trim() === '') return null;
    const v = String(raw).trim().toLowerCase();
    if(['마감','마감중','closed','close','종료','off','no','n'].includes(v)) return 'closed';
    return 'open';
  }

  function driveFileId(url){
    if(!url) return null;
    const m = String(url).match(/\/file\/d\/([-\w]{20,})/)
           || String(url).match(/[?&]id=([-\w]{20,})/);
    return m ? m[1] : null;
  }
  function viewUrl(url){
    const id = driveFileId(url);
    return id ? 'https://drive.google.com/file/d/' + id + '/view' : url;
  }
  function downloadUrl(url){
    const id = driveFileId(url);
    return id ? 'https://drive.google.com/uc?export=download&id=' + id : null;
  }

  function fieldByKey(key){
    return Object.keys(FIELD_META).find(f => FIELD_META[f].key === key) || null;
  }
  function fieldOrder(){
    return Object.keys(FIELD_META).sort((a,b)=>FIELD_META[a].order-FIELD_META[b].order);
  }

  /* ── 시트 응답 해석 ────────────────────────── */
  function gridToRows(values){
    if(!values.length) return [];
    const header = values[0] || [];
    const cols = [];
    for(let c = 1; c < header.length; c++){
      const name = (header[c] == null ? '' : String(header[c])).trim();
      if(name) cols.push({ col:c, name:name });
    }
    if(!cols.length) return [];

    const rows = [];
    const statuses = [];
    for(let r = 1; r < values.length; r++){
      const line = values[r] || [];
      const title = (line[0] == null ? '' : String(line[0])).trim();
      if(!title) continue;

      if(/상태$/.test(title)){
        const base = title.replace(/상태$/, '').trim();
        if(!base) continue;
        const map = {};
        cols.forEach(c => { map[c.name] = (line[c.col] == null ? '' : String(line[c.col])).trim(); });
        statuses.push({ base, map });
        continue;
      }
      cols.forEach(c => {
        const url = (line[c.col] == null ? '' : String(line[c.col])).trim();
        if(!url) return;
        rows.push({ fieldRaw:c.name, title, url, status:'' });
      });
    }
    statuses.forEach(s => {
      rows.forEach(row => {
        if(row.title === s.base && s.map[row.fieldRaw]) row.status = s.map[row.fieldRaw];
      });
    });

    const out = [];
    rows.forEach(r => {
      const f = normalizeField(r.fieldRaw);
      if(f) out.push({ field:f, title:r.title || '자료', url:r.url, status:r.status });
    });
    return out;
  }

  function toRows(data){
    const rows = [];
    const push = (field, title, url, status) => {
      const f = normalizeField(field);
      const u = (url == null ? '' : String(url)).trim();
      if(!f || !u) return;
      rows.push({
        field:f,
        title:(title == null ? '' : String(title)).trim() || '자료',
        url:u,
        status:(status == null ? '' : String(status)).trim(),
      });
    };

    if(Array.isArray(data)){
      if(Array.isArray(data[0])) return gridToRows(data);
      data.forEach(r => {
        if(!r) return;
        push(r.field || r['분야'], r.title || r['제목'], r.url || r.link || r['링크'], r.status || r['상태']);
      });
      return rows;
    }

    if(data && typeof data === 'object'){
      Object.keys(data).forEach(key => {
        const entry = data[key];
        if(Array.isArray(entry)){
          entry.forEach(r => push(key, r.title || r['제목'], r.url || r.link || r['링크'], r.status || r['상태']));
          return;
        }
        if(!entry || typeof entry !== 'object') return;
        push(key, '웹 리플렛', entry.leaflet, '');
        push(key, '만족도 조사 문항', entry.survey, entry.status || '진행');
        push(key, '웹 만족도 분석 보고서', entry.report, '');
      });
    }
    return rows;
  }

  /* 온라인(웹 주소) / 문서파일(드라이브 파일)로 나눕니다. */
  function splitFor(field){
    const mine = ROWS.filter(r => r.field === field);
    return {
      online: mine.filter(r => !driveFileId(r.url)),
      docs:   mine.filter(r => driveFileId(r.url)),
    };
  }

  /* ── 화면 ────────────────────────────────── */
  function renderPicker(){
    const picks = fieldOrder().map(f => {
      const meta = FIELD_META[f];
      const s = splitFor(f);
      const total = s.online.length + s.docs.length;
      const count = total ? ('온라인 ' + s.online.length + '건 · 문서 ' + s.docs.length + '건') : '준비중';
      return '<button class="pick" style="--accent:' + meta.color + '" data-key="' + meta.key + '">' +
        '<img src="' + meta.image + '" alt="">' +
        '<span class="tint"></span><span class="scrim"></span>' +
        '<span class="foot"><h2>' + f + '</h2><span class="count">' + count + '</span></span>' +
      '</button>';
    }).join('');

    document.getElementById('view').innerHTML =
      '<div class="picker">' +
        '<p class="kicker">K-Arts Gifted Project · 2026</p>' +
        '<h1>K예술영재 프로젝트</h1>' +
        '<p class="lede">분야를 선택하면 만족도 조사 문항, 웹 리플렛, 분석 보고서와 내려받을 수 있는 문서를 한자리에서 볼 수 있습니다.</p>' +
        '<div class="picks">' + picks + '</div>' +
      '</div>';

    document.querySelectorAll('.pick').forEach(el => {
      el.addEventListener('click', () => { location.hash = '#/' + el.dataset.key; });
    });
  }

  function onlineItem(row){
    const st = statusOf(row.status);
    const pill = st
      ? '<span class="status-pill is-' + st + '">' + (st === 'open' ? '진행중' : '마감') + '</span>'
      : '';
    return '<a class="item" href="' + esc(row.url) + '" target="_blank" rel="noopener">' +
      '<span class="item-name">' + esc(row.title) + '</span>' + pill +
      '<span class="go">열기 →</span></a>';
  }

  function docItem(row){
    const dl = downloadUrl(row.url);
    return '<div class="item">' +
      '<span class="item-name">' + esc(row.title) + '</span>' +
      '<span class="doc-actions">' +
        '<a class="doc-btn" href="' + esc(viewUrl(row.url)) + '" target="_blank" rel="noopener">보기</a>' +
        (dl ? '<a class="doc-btn download" href="' + esc(dl) + '" rel="noopener"><span class="ico">↓</span>다운로드</a>' : '') +
      '</span></div>';
  }

  function renderField(field, tab){
    const meta = FIELD_META[field];
    const s = splitFor(field);
    const list = tab === 'docs' ? s.docs : s.online;

    const rail = fieldOrder().map(f => {
      const m = FIELD_META[f];
      const on = f === field;
      return '<a class="rail-item' + (on ? ' is-active' : '') + '" style="color:' +
        (on ? m.color : '') + '" href="#/' + m.key + '">' +
        '<span class="dot" style="background:' + m.color + '"></span>' + f + '</a>';
    }).join('');

    const body = list.length
      ? '<div class="items">' + list.map(tab === 'docs' ? docItem : onlineItem).join('') + '</div>'
      : '<div class="empty">' + (tab === 'docs'
          ? '등록된 문서 파일이 없습니다. 시트의 해당 분야 칸에 구글 드라이브 링크를 넣으면 여기에 표시됩니다.'
          : '등록된 온라인 링크가 없습니다. 시트의 해당 분야 칸에 주소를 넣으면 여기에 표시됩니다.') + '</div>';

    document.getElementById('view').innerHTML =
      '<div class="browser" style="--accent:' + meta.color + '">' +
        '<aside class="rail">' +
          '<a class="home" href="#">← 분야 선택</a>' +
          '<nav>' + rail + '</nav>' +
        '</aside>' +
        '<main>' +
          '<div class="panel-head">' +
            '<p class="kicker">K예술영재 프로젝트 · 2026</p>' +
            '<h1>' + field + '</h1>' +
            '<p class="sub">온라인 ' + s.online.length + '건 · 문서파일 ' + s.docs.length + '건</p>' +
          '</div>' +
          '<div class="tabs">' +
            '<button class="tab' + (tab !== 'docs' ? ' is-active' : '') + '" data-tab="online">온라인<span class="n">' + s.online.length + '</span></button>' +
            '<button class="tab' + (tab === 'docs' ? ' is-active' : '') + '" data-tab="docs">문서파일<span class="n">' + s.docs.length + '</span></button>' +
          '</div>' +
          body +
          '<p class="updated">마지막 갱신: ' + new Date().toLocaleString('ko-KR') + '</p>' +
        '</main>' +
      '</div>';

    document.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', () => {
        location.hash = '#/' + meta.key + '/' + el.dataset.tab;
      });
    });
  }

  /* ── 주소(#) 기반 화면 전환 ─────────────────── */
  function route(){
    const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    const field = parts.length ? fieldByKey(parts[0]) : null;
    if(!field){ renderPicker(); return; }
    renderField(field, parts[1] === 'docs' ? 'docs' : 'online');
    window.scrollTo(0, 0);
  }

  function notice(msg){
    const banner = document.getElementById('setupBanner');
    banner.style.display = 'block';
    banner.textContent = msg;
  }

  async function load(){
    try{
      const res = await fetch(LINK_API_URL + '?_=' + Date.now(), { cache:'no-store' });
      const data = await res.json();
      console.log('[디버그] Apps Script 응답:', data);
      ROWS = toRows(data);
      console.log('[디버그] 버튼으로 만든 줄:', ROWS);
      if(!ROWS.length){
        notice('시트에서 링크를 한 줄도 읽지 못했습니다. 1행의 분야 이름(무용·미술·음악·전통예술)과 A열 항목 이름을 확인해 주세요.');
      }
    }catch(err){
      console.error(err);
      ROWS = FALLBACK_ROWS;
      notice('시트를 불러오지 못했습니다. Apps Script 웹앱 배포 상태(액세스 권한: 모든 사용자)를 확인해 주세요. 아래 문서 파일은 정상적으로 내려받을 수 있습니다.');
    }
    route();
  }

  window.addEventListener('hashchange', route);
  load();
</script>

</body>
</html>

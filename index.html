<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<!-- ============================================================
     이동할 주소 — 여기 한 줄만 바꾸시면 됩니다.
     아래 세 곳(meta / link / script)의 주소가 같아야 합니다.
     ============================================================ -->
<meta http-equiv="refresh" content="0; url=https://kartsgifted.github.io/workshop/index.html">
<link rel="canonical" href="https://kartsgifted.github.io/workshop/index.html">

<title>K예술영재 프로젝트 워크숍 자료실로 이동합니다</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg:#14171D;
    --surface:#1D212B;
    --text:#EDE7D8;
    --text-soft:#B7AF9C;
    --text-faint:#7C7669;
    --brass:#D4AF5A;
    --line:#2B303B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    word-break:keep-all;
    -webkit-font-smoothing:antialiased;
  }
  .card{ max-width:420px; text-align:center; }
  .kicker{
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--text-faint);
    margin:0;
  }
  h1{
    font-size:26px;
    font-weight:800;
    line-height:1.35;
    margin:12px 0 0;
  }
  p.lede{
    margin:14px 0 26px;
    font-size:14.5px;
    line-height:1.75;
    color:var(--text-soft);
  }
  .spinner{
    width:22px; height:22px;
    margin:0 auto 22px;
    border:2px solid var(--line);
    border-top-color:var(--brass);
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media(prefers-reduced-motion:reduce){ .spinner{ animation:none; } }

  a.go{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 22px;
    border-radius:10px;
    background:var(--brass);
    color:var(--bg);
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.go:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(212,175,90,.28); }
  a.go:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  .fallback{
    margin-top:20px;
    font-size:12.5px;
    line-height:1.7;
    color:var(--text-faint);
    word-break:break-all;
  }
  .fallback a{ color:var(--text-soft); }
</style>
</head>
<body>

<div class="card">
  <div class="spinner" aria-hidden="true"></div>
  <p class="kicker">K-Arts Gifted Project</p>
  <h1>워크숍 자료실로<br>이동하고 있습니다</h1>
  <p class="lede">잠시만 기다려 주세요. 화면이 바뀌지 않으면 아래 버튼을 눌러주세요.</p>

  <a class="go" id="goLink" href="https://kartsgifted.github.io/workshop/index.html">
    자료실 열기 <span aria-hidden="true">→</span>
  </a>

  <p class="fallback">
    주소: <a href="https://kartsgifted.github.io/workshop/index.html">kartsgifted.github.io/workshop/</a>
  </p>
</div>

<script>
  // 주소창에 이 페이지가 남지 않도록 replace 를 씁니다. (뒤로가기로 되돌아오지 않음)
  var TARGET = 'https://kartsgifted.github.io/workshop/index.html';
  document.getElementById('goLink').setAttribute('href', TARGET);
  location.replace(TARGET);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 | 만족도조사 · 분석보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#14171D;
    --surface:#1D212B;
    --text:#EDE7D8;
    --text-soft:#B7AF9C;
    --text-faint:#7C7669;
    --brass:#D4AF5A;
    --brass-deep:#E9C97E;
    --line:#2B303B;

    --dance:#E08AA6;
    --art:#7FC17A;
    --music:#7FB0DD;
    --trad:#E08A5E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    color:var(--text);
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  .layout{
    max-width:1280px;
    margin:0 auto;
    padding:64px 24px 100px;
    display:grid;
    grid-template-columns:440px 1fr;
    gap:48px;
    align-items:start;
  }
  @media(max-width:860px){
    .layout{ grid-template-columns:1fr; gap:8px; }
  }

  header{
    position:sticky;
    top:48px;
  }
  header .kicker{
    font-size:13.5px;
    color:var(--text-faint);
    margin-bottom:18px;
  }
  header h1{
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-weight:800;
    font-size:clamp(56px,6.3vw,78px);
    line-height:1.2;
    color:var(--text);
    margin:0;
  }
  header p{
    color:var(--text-soft);
    font-size:15px;
    line-height:1.7;
    margin:32px 0 0;
    max-width:34ch;
  }
  header .rule{
    display:none;
  }
  @media(max-width:860px){
    header{ position:static; padding-bottom:32px; border-bottom:1px solid var(--line); margin-bottom:32px; }
    header p{ max-width:52ch; }
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:32px 28px;
    align-items:start;
  }
  @media(max-width:1080px){
    .grid{ grid-template-columns:1fr; }
  }

  .tile{
    background:var(--surface);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 32px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tile:hover{
    transform:translateY(-3px);
    box-shadow:0 4px 12px rgba(0,0,0,.35), 0 22px 44px rgba(0,0,0,.5);
  }

  .tile .photo{
    position:relative;
    aspect-ratio:4/3;
    background:
      radial-gradient(120% 140% at 15% 0%, color-mix(in srgb, var(--accent) 55%, white) 0%, transparent 55%),
      linear-gradient(150deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, #0C0E12) 100%);
    overflow:hidden;
  }
  .tile .photo img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:grayscale(0.85) contrast(1.05) brightness(0.85);
  }
  .tile .photo .tint{
    position:absolute; inset:0;
    background:var(--accent);
    mix-blend-mode:color;
    opacity:.9;
  }
  .tile .photo .tint::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(150deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 100%);
    mix-blend-mode:multiply;
  }
  .tile .photo .mark{
    position:absolute;
    right:18px; bottom:12px;
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-size:76px;
    line-height:1;
    color:rgba(255,255,255,.22);
    user-select:none;
  }
  .tile .photo .num{
    position:absolute;
    top:16px; left:18px;
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-size:14px;
    color:rgba(255,255,255,.85);
  }
  .tile .photo .scrim{
    position:absolute; left:0; right:0; bottom:0;
    height:60%;
    background:linear-gradient(180deg, transparent, rgba(15,20,30,.62));
  }
  .tile .photo .caption{
    position:absolute;
    left:18px; right:18px; bottom:14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
  }
  .tile .photo h2{
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-weight:600;
    font-size:23px;
    color:#fff;
    margin:0;
  }
  .leaflet-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.4);
    backdrop-filter:blur(3px);
    color:#fff;
    font-weight:600;
    font-size:12.5px;
    text-decoration:none;
    transition:background .15s ease;
    white-space:nowrap;
  }
  .leaflet-btn:hover{
    background:rgba(255,255,255,.3);
  }
  .leaflet-btn.disabled{
    color:rgba(255,255,255,.5);
    border-color:rgba(255,255,255,.22);
    cursor:default;
    pointer-events:none;
  }

  .tile .body{
    padding:18px 20px 22px;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:600;
    padding:3px 10px 3px 8px;
    border-radius:999px;
    background:rgba(0,0,0,.08);
    color:var(--surface);
  }
  .status-pill::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
  }
  .status-pill.is-open::before{ background:#3E8A2E; }
  .status-pill.is-closed::before{ background:#B8492B; }

  .link-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .link-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .link-btn:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--surface);
  }
  .link-btn.primary{
    background:var(--text);
    border-color:var(--text);
    color:var(--surface);
  }
  .link-btn.primary:hover{
    background:var(--accent);
    border-color:var(--accent);
  }
  .link-btn .arrow{
    font-size:13px;
    line-height:1;
  }
  .link-btn.disabled{
    color:var(--text-faint);
    background:transparent;
    border:1px dashed var(--line);
    cursor:default;
    pointer-events:none;
  }

  .docs{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .docs-title{
    font-size:12.5px;
    color:var(--text-faint);
    margin:0 0 8px;
  }
  .doc-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 0;
  }
  .doc-row + .doc-row{
    border-top:1px solid rgba(255,255,255,.05);
  }
  .doc-name{
    flex:1;
    min-width:0;
    font-size:13.5px;
    line-height:1.4;
    color:var(--text-soft);
  }
  .doc-actions{
    display:flex;
    gap:6px;
    flex:none;
  }
  .doc-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 11px;
    border-radius:7px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-soft);
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .doc-btn:hover,
  .doc-btn:focus-visible{
    border-color:var(--accent);
    color:var(--accent);
  }
  .doc-btn.download{
    background:rgba(255,255,255,.05);
    color:var(--text);
  }
  .doc-btn.download:hover,
  .doc-btn.download:focus-visible{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--surface);
  }
  .doc-btn .ico{
    font-size:11px;
    line-height:1;
  }
  .doc-row.is-empty .doc-name{ color:var(--text-faint); }
  .doc-row.is-empty .doc-btn{
    border-style:dashed;
    color:var(--text-faint);
    background:transparent;
    pointer-events:none;
  }
  @media(max-width:340px){
    .doc-row{ flex-wrap:wrap; gap:6px; }
    .doc-name{ flex:1 0 100%; }
  }

  .updated{
    text-align:right;
    color:var(--text-faint);
    font-size:12.5px;
    margin-top:32px;
  }

  .setup-banner{
    margin:0 0 28px;
    padding:16px 20px;
    background:#3A3120;
    border:1px solid var(--brass);
    border-radius:4px;
    color:var(--brass-deep);
    font-size:13.5px;
    line-height:1.6;
  }
  .setup-banner code{
    background:rgba(0,0,0,.06);
    padding:1px 6px;
    border-radius:4px;
    font-size:12.5px;
  }

  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
    font-size:14px;
  }

  @media(max-width:560px){
    .row{ grid-template-columns:1fr; gap:8px; }
    .row .num{ padding-top:0; }
  }
</style>
</head>
<body>

<div class="layout">
<header>
  <div class="kicker">K-Arts Gifted Project · 2026</div>
  <h1>K예술영재<br>프로젝트</h1>
  <p>분야별 만족도 조사 문항에 참여하고, 웹 리플렛과 웹 분석 보고서를 열어보거나 PDF 파일로 내려받을 수 있습니다.</p>
  <div class="rule"></div>
</header>

<main>
  <div id="setupBanner" class="setup-banner" style="display:none;"></div>
  <div id="content">
    <div class="state-msg">불러오는 중…</div>
  </div>
  <div id="updatedWrap"></div>
</main>
</div>

<script>
/* ============================================================
   설정 (CONFIG)
   구글시트 → Apps Script 웹앱 → 이 페이지 순서로 데이터가 흘러갑니다.

   시트 형식 (1행은 머리글, 2행부터 한 줄이 버튼 하나):
   ┌─────────────────────────┬──────────────┬──────────────┬──────────────┬──────────────┐
   │ A 항목                   │ B 무용        │ C 미술        │ D 음악        │ E 전통예술     │
   ├─────────────────────────┼──────────────┼──────────────┼──────────────┼──────────────┤
   │ 웹 리플렛                 │ https://…    │ https://…    │ https://…    │ https://…    │
   │ 만족도 조사 문항           │ https://forms│ https://forms│ https://forms│ https://forms│
   │ 만족도 조사 문항 상태       │ 진행          │ 마감          │ 진행          │              │
   │ 웹 만족도 분석 보고서       │ https://…    │              │ https://…    │ https://…    │
   │ 리플렛                    │ https://drive│ https://drive│ https://drive│ https://drive│
   │ 마스터클래스 안내지         │              │              │ https://drive│              │
   │ 만족도 조사 분석 보고서     │ https://drive│ https://drive│ https://drive│ https://drive│
   └─────────────────────────┴──────────────┴──────────────┴──────────────┴──────────────┘

   - A열 "항목"에 적은 글자가 그대로 버튼 이름이 됩니다.
   - 칸이 비어 있으면 그 분야에는 그 버튼이 생기지 않습니다.
   - 링크가 구글 드라이브 파일 주소면 자료 (PDF) 칸에 [보기] [다운로드] 두 버튼으로,
     그 밖의 주소면 카드 위쪽 버튼으로 자동 배치됩니다.
   - 항목 이름에 "리플렛"이 들어간 웹 주소는 카드 사진 위 버튼이 됩니다.
   - 항목 이름이 "○○ 상태"인 줄은 버튼이 되지 않고, 같은 이름의 "○○" 버튼에
     진행/마감 배지를 붙입니다. (예: "만족도 조사 문항 상태")
   - 줄을 추가하면 버튼이 늘고, 지우면 사라집니다. 순서도 시트 줄 순서를 따릅니다.
   ============================================================ */
  const LINK_API_URL = 'https://script.google.com/macros/s/AKfycbyATIckZ-DIO3wxiVxXoO3l5CreV8Y4JO45eCmi0m4OHHQ993D6ed5OCd2N-pVkdEvDHg/exec';

/* ============================================================ */

  const FIELD_META = {
    '무용':  { key:'dance', color:'var(--dance)',  order:1, mark:'舞', image:'https://k-brainc.github.io/kriga/img/b.webp' },
    '미술':  { key:'art',   color:'var(--art)',    order:2, mark:'畵', image:'https://k-brainc.github.io/kriga/img/a.jpg' },
    '음악':  { key:'music', color:'var(--music)',  order:3, mark:'樂', image:'https://k-brainc.github.io/kriga/img/m.jpg' },
    '전통예술': { key:'trad', color:'var(--trad)', order:4, mark:'傳', image:'https://k-brainc.github.io/kriga/img/t.webp' },
  };
  // 각 분야의 실제 워크숍 사진 주소를 image 자리에 넣으면 사진이 표시됩니다.

  /* 시트에 아직 드라이브 링크 줄이 없는 분야에만 쓰이는 예비 목록입니다.
     해당 분야에 드라이브 링크를 한 줄이라도 넣으면 그때부터 시트 값만 사용합니다. */
  const FALLBACK_DOCS = {
    '무용': [
      { title:'리플렛', url:'https://drive.google.com/file/d/14NkDIaKCOnEvOv0ZapOYobRwiRLCgbUn/view?usp=sharing' },
      { title:'만족도 조사 분석 보고서', url:'https://drive.google.com/file/d/1NkOKKWRjnKESPyCF5gxJEHGGDI6oSJzb/view?usp=sharing' },
    ],
    '미술': [
      { title:'리플렛', url:'https://drive.google.com/file/d/1Al1Do0ng8LqXtPxx_YpxKWiX7x-MwHiu/view?usp=sharing' },
      { title:'만족도 조사 분석 보고서', url:'https://drive.google.com/file/d/1tM_O3wf1XOUernl9tBMEtCS9JbBkpc42/view?usp=sharing' },
    ],
    '음악': [
      { title:'리플렛', url:'https://drive.google.com/file/d/1Uqj0GWgrQyHuJlO-sloi_R54MTQcDPsp/view?usp=sharing' },
      { title:'마스터클래스 안내지', url:'https://drive.google.com/file/d/1_zXAlnpoKqUhDXFwWChFc-Zbk-706h3B/view?usp=sharing' },
      { title:'연주회 안내지', url:'https://drive.google.com/file/d/1ZNlxJr_31me-RnpvMgB7-cW1-55vakYT/view?usp=sharing' },
      { title:'만족도 조사 분석 보고서', url:'https://drive.google.com/file/d/1DWH01hbmnI6Q5_csZejIX8OytWyKLQeX/view?usp=sharing' },
    ],
    '전통예술': [
      { title:'리플렛', url:'https://drive.google.com/file/d/1_e6n1CtpSQiCdyLDXufNpcAALEvSw6ZT/view?usp=sharing' },
      { title:'만족도 조사 분석 보고서', url:'https://drive.google.com/file/d/1sdaGmI84anC8sR43WvQK_x8KNJ5NuZwv/view?usp=sharing' },
    ],
  };

  const FIELD_ALIASES = {
    '무용':'무용', '발레':'무용', 'dance':'무용', 'ballet':'무용',
    '미술':'미술', '시각예술':'미술', 'art':'미술', 'visual arts':'미술',
    '음악':'음악', 'music':'음악',
    '전통예술':'전통예술', '전통':'전통예술', 'traditional arts':'전통예술', 'traditional':'전통예술',
  };

  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function normalizeField(raw){
    if(!raw) return null;
    const t = String(raw).trim();
    if(FIELD_ALIASES[t]) return FIELD_ALIASES[t];
    const lower = t.toLowerCase();
    if(FIELD_ALIASES[lower]) return FIELD_ALIASES[lower];
    return null;
  }

  /* 상태 칸: 비어 있으면 배지 없음, 값이 있으면 진행중 또는 마감 배지 */
  function statusOf(raw){
    if(raw === undefined || raw === null || String(raw).trim() === '') return null;
    const v = String(raw).trim().toLowerCase();
    if(['마감','마감중','closed','close','종료','off','no','n'].includes(v)) return 'closed';
    return 'open';
  }

  /* 구글 드라이브 공유 링크에서 파일 ID를 뽑아냅니다. */
  function driveFileId(url){
    if(!url) return null;
    const m = String(url).match(/\/file\/d\/([-\w]{20,})/)
           || String(url).match(/[?&]id=([-\w]{20,})/);
    return m ? m[1] : null;
  }

  function viewUrl(url){
    const id = driveFileId(url);
    return id ? 'https://drive.google.com/file/d/' + id + '/view' : url;
  }

  function downloadUrl(url){
    const id = driveFileId(url);
    return id ? 'https://drive.google.com/uc?export=download&id=' + id : null;
  }

  /* 웹앱이 시트 격자(2차원 배열)를 그대로 보낼 때도 같은 규칙으로 펼칩니다.
     1행: [항목, 무용, 미술, 음악, 전통예술] / 2행부터: [항목명, 링크, 링크, …] */
  function gridToRows(values){
    if(!values.length) return [];
    const header = values[0] || [];
    const cols = [];
    for(let c = 1; c < header.length; c++){
      const name = (header[c] == null ? '' : String(header[c])).trim();
      if(name) cols.push({ col:c, name:name });
    }
    if(!cols.length) return [];

    const rows = [];
    const statuses = [];
    for(let r = 1; r < values.length; r++){
      const line = values[r] || [];
      const title = (line[0] == null ? '' : String(line[0])).trim();
      if(!title) continue;

      if(/상태$/.test(title)){
        const base = title.replace(/상태$/, '').trim();
        if(!base) continue;
        const map = {};
        cols.forEach(c => { map[c.name] = (line[c.col] == null ? '' : String(line[c.col])).trim(); });
        statuses.push({ base, map });
        continue;
      }

      cols.forEach(c => {
        const url = (line[c.col] == null ? '' : String(line[c.col])).trim();
        if(!url) return;
        rows.push({ fieldRaw:c.name, title, url, status:'' });
      });
    }

    statuses.forEach(s => {
      rows.forEach(row => {
        if(row.title === s.base && s.map[row.fieldRaw]) row.status = s.map[row.fieldRaw];
      });
    });

    const out = [];
    rows.forEach(r => {
      const f = normalizeField(r.fieldRaw);
      if(!f) return;
      out.push({ field:f, title:r.title || '자료', url:r.url, status:r.status });
    });
    return out;
  }

  /* 웹앱 응답을 { field, title, url, status } 줄 목록으로 정리합니다.
     새 형식(줄 목록)과 예전 형식(분야별 묶음) 둘 다 받습니다. */
  function toRows(data){
    const rows = [];
    const push = (field, title, url, status) => {
      const f = normalizeField(field);
      const u = (url == null ? '' : String(url)).trim();
      if(!f || !u) return;
      rows.push({
        field: f,
        title: (title == null ? '' : String(title)).trim() || '자료',
        url: u,
        status: (status == null ? '' : String(status)).trim(),
      });
    };

    if(Array.isArray(data)){
      if(Array.isArray(data[0])) return gridToRows(data);
      data.forEach(r => {
        if(!r) return;
        push(r.field || r['분야'], r.title || r['제목'], r.url || r.link || r['링크'], r.status || r['상태']);
      });
      return rows;
    }

    if(data && typeof data === 'object'){
      Object.keys(data).forEach(key => {
        const entry = data[key];
        if(Array.isArray(entry)){
          entry.forEach(r => push(key, r.title || r['제목'], r.url || r.link || r['링크'], r.status || r['상태']));
          return;
        }
        if(!entry || typeof entry !== 'object') return;
        push(key, '웹 리플렛', entry.leaflet, '');
        push(key, '만족도 조사 문항', entry.survey, entry.status || '진행');
        push(key, '웹 만족도 분석 보고서', entry.report, '');
      });
    }
    return rows;
  }

  /* 한 분야의 줄들을 사진 위 버튼 / 웹 버튼 / PDF 목록으로 나눕니다. */
  function groupFor(field, rows){
    const mine = rows.filter(r => r.field === field);
    const pdf = mine.filter(r => driveFileId(r.url));
    const web = mine.filter(r => !driveFileId(r.url));

    let leaflet = null;
    const i = web.findIndex(r => /리플렛|leaflet/i.test(r.title));
    if(i >= 0) leaflet = web.splice(i, 1)[0];

    const docs = pdf.length ? pdf : (FALLBACK_DOCS[field] || []);
    return { leaflet, web, docs };
  }

  function leafletBtn(row){
    if(!row){
      return '<span class="leaflet-btn disabled"><span>웹 리플렛 준비중</span></span>';
    }
    return '<a class="leaflet-btn" href="' + esc(row.url) + '" target="_blank" rel="noopener">' +
      '<span>' + esc(row.title) + '</span><span class="arrow">→</span></a>';
  }

  function webBtn(row){
    const st = statusOf(row.status);
    const pill = st
      ? '<span class="status-pill is-' + st + '">' + (st === 'open' ? '진행중' : '마감') + '</span>'
      : '';
    const cls = st ? 'link-btn primary' : 'link-btn';
    return '<a class="' + cls + '" href="' + esc(row.url) + '" target="_blank" rel="noopener">' +
      '<span>' + esc(row.title) + '</span>' + pill + '<span class="arrow">→</span></a>';
  }

  function docRow(row){
    const dl = downloadUrl(row.url);
    const dlBtn = dl
      ? '<a class="doc-btn download" href="' + esc(dl) + '" rel="noopener"><span class="ico">↓</span><span>다운로드</span></a>'
      : '';
    return '<div class="doc-row">' +
      '<div class="doc-name">' + esc(row.title) + '</div>' +
      '<div class="doc-actions">' +
        '<a class="doc-btn" href="' + esc(viewUrl(row.url)) + '" target="_blank" rel="noopener">보기</a>' +
        dlBtn +
      '</div></div>';
  }

  function render(rows){
    const content = document.getElementById('content');
    const fields = Object.keys(FIELD_META).sort((a,b)=>FIELD_META[a].order-FIELD_META[b].order);

    content.innerHTML = '<div class="grid">' + fields.map((f, i)=>{
        const meta = FIELD_META[f];
        const g = groupFor(f, rows);
        const photoInner = meta.image
          ? '<img src="' + meta.image + '" alt="' + f + ' 분야"><div class="tint"></div>'
          : '<span class="mark">' + meta.mark + '</span>';

        const webBlock = g.web.length
          ? g.web.map(webBtn).join('')
          : '<span class="link-btn disabled"><span>링크</span><span class="arrow">준비중</span></span>';

        const docsBlock = g.docs.length
          ? '<div class="docs"><p class="docs-title">자료 (PDF)</p>' + g.docs.map(docRow).join('') + '</div>'
          : '';

        return '<div class="tile" style="--accent:' + meta.color + '">' +
          '<div class="photo">' + photoInner +
            '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
            '<div class="scrim"></div>' +
            '<div class="caption"><h2>' + f + '</h2>' + leafletBtn(g.leaflet) + '</div>' +
          '</div>' +
          '<div class="body">' +
            '<div class="link-row">' + webBlock + '</div>' +
            docsBlock +
          '</div></div>';
      }).join('') + '</div>';

    document.getElementById('updatedWrap').innerHTML =
      '<div class="updated">마지막 갱신: ' + new Date().toLocaleString('ko-KR') + '</div>';
  }

  function notice(msg){
    const banner = document.getElementById('setupBanner');
    banner.style.display = 'block';
    banner.textContent = msg;
  }

  async function load(){
    try{
      const res = await fetch(LINK_API_URL + '?_=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      console.log('[디버그] Apps Script 응답:', data);

      const rows = toRows(data);
      console.log('[디버그] 버튼으로 만든 줄:', rows);
      render(rows);

      if(!rows.length){
        notice('시트에서 링크를 한 줄도 읽지 못했습니다. 분야·제목·링크 열 이름과 분야 표기(무용/미술/음악/전통예술)를 확인해 주세요.');
      }
    }catch(err){
      console.error(err);
      render([]);
      notice('시트를 불러오지 못했습니다. Apps Script 웹앱 배포 상태(액세스 권한: 전체)를 확인해 주세요. 아래 PDF 자료는 정상적으로 내려받을 수 있습니다.');
    }
  }

  load();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 | 만족도조사 · 분석보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --paper:#F6F0DF;
    --panel:#FCF8EE;
    --ink:#1E2A3C;
    --ink-soft:#5B6472;
    --ink-faint:#8B8577;
    --brass:#9C7A32;
    --brass-deep:#7D611F;
    --line:#DED0AC;

    --dance:#AD5E77;
    --art:#557E52;
    --music:#476F8F;
    --trad:#A14C2B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    color:var(--ink);
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  header{
    max-width:1040px;
    margin:0 auto;
    padding:72px 24px 40px;
  }
  header .kicker{
    font-size:13.5px;
    color:var(--ink-faint);
    margin-bottom:18px;
  }
  header h1{
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:clamp(30px,5vw,42px);
    line-height:1.25;
    color:var(--ink);
    margin:0 0 18px;
  }
  header p{
    color:var(--ink-soft);
    font-size:15.5px;
    line-height:1.7;
    margin:0;
    max-width:52ch;
  }
  header .rule{
    margin-top:36px;
    height:1px;
    background:var(--line);
  }

  main{
    max-width:1040px;
    margin:0 auto;
    padding:0 24px 100px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:32px 28px;
  }
  @media(max-width:700px){
    .grid{ grid-template-columns:1fr; }
  }

  .tile{
    background:var(--panel);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(30,42,60,.04), 0 12px 28px rgba(30,42,60,.08);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tile:hover{
    transform:translateY(-3px);
    box-shadow:0 4px 10px rgba(30,42,60,.06), 0 20px 36px rgba(30,42,60,.12);
  }

  .tile .photo{
    position:relative;
    aspect-ratio:4/3;
    background:
      radial-gradient(120% 140% at 15% 0%, color-mix(in srgb, var(--accent) 55%, white) 0%, transparent 55%),
      linear-gradient(150deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, #1E2A3C) 100%);
    overflow:hidden;
  }
  .tile .photo img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .tile .photo .mark{
    position:absolute;
    right:18px; bottom:12px;
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-size:76px;
    line-height:1;
    color:rgba(255,255,255,.22);
    user-select:none;
  }
  .tile .photo .num{
    position:absolute;
    top:16px; left:18px;
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-size:14px;
    color:rgba(255,255,255,.85);
  }
  .tile .photo .scrim{
    position:absolute; left:0; right:0; bottom:0;
    height:60%;
    background:linear-gradient(180deg, transparent, rgba(15,20,30,.62));
  }
  .tile .photo .caption{
    position:absolute;
    left:18px; right:18px; bottom:14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
  }
  .tile .photo h2{
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-weight:600;
    font-size:23px;
    color:#fff;
    margin:0;
  }

  .tile .body{
    padding:18px 20px 22px;
  }
  .tile .field-name{
    font-size:12.5px;
    font-weight:600;
    color:var(--accent);
    margin-bottom:12px;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:600;
    padding:3px 10px 3px 8px;
    border-radius:999px;
    background:rgba(255,255,255,.18);
    color:#fff;
    backdrop-filter:blur(2px);
  }
  .status-pill::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
  }
  .status-pill.is-open::before{ background:#8FD66B; }
  .status-pill.is-closed::before{ background:#E0836A; }

  .link-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .link-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .link-btn:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--panel);
  }
  .link-btn.primary{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--panel);
  }
  .link-btn.primary:hover{
    background:var(--accent);
    border-color:var(--accent);
  }
  .link-btn .arrow{
    font-size:13px;
    line-height:1;
  }
  .link-btn.disabled{
    color:var(--ink-faint);
    background:transparent;
    border:1px dashed var(--line);
    cursor:default;
    pointer-events:none;
  }

  .updated{
    text-align:right;
    color:var(--ink-faint);
    font-size:12.5px;
    margin-top:32px;
  }

  .setup-banner{
    max-width:1040px;
    margin:0 auto 28px;
    padding:16px 20px;
    background:#F3E6C4;
    border:1px solid var(--brass);
    border-radius:4px;
    color:var(--brass-deep);
    font-size:13.5px;
    line-height:1.6;
  }
  .setup-banner code{
    background:rgba(0,0,0,.06);
    padding:1px 6px;
    border-radius:4px;
    font-size:12.5px;
  }

  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
    font-size:14px;
  }

  @media(max-width:560px){
    .row{ grid-template-columns:1fr; gap:8px; }
    .row .num{ padding-top:0; }
  }
</style>
</head>
<body>

<header>
  <div class="kicker">K-Arts Gifted Project · 2026</div>
  <h1>K예술영재 프로젝트</h1>
  <p>분야별 리플렛, 만족도 조사 문항, 만족도 조사 분석 보고서를 확인할 수 있습니다.</p>
  <div class="rule"></div>
</header>

<main>
  <div id="setupBanner" class="setup-banner" style="display:none;"></div>
  <div id="content">
    <div class="state-msg">불러오는 중…</div>
  </div>
  <div id="updatedWrap"></div>
</main>

<script>
/* ============================================================
   설정 (CONFIG)
   Apps Script 웹앱 주소로 "조사 링크" 탭 데이터를 가져옵니다.
   (시트: K예술영재 프로젝트_워크숍 만족도 조사)

   시트 형식 ("조사 링크" 탭, 첫 행은 헤더):
   ┌────────────┬──────────────┬──────────────────────┬──────────────────────┬────────┐
   │ 분야        │ 리플렛 링크    │ 만족도조사 링크        │ 분석보고서 링크         │ 상태    │
   ├────────────┼──────────────┼──────────────────────┼──────────────────────┼────────┤
   │ 무용        │ https://...  │ https://...          │ https://...          │ 진행    │
   │ 미술        │ https://...  │ https://...          │ https://...          │ 마감    │
   │ 음악        │ https://...  │ https://...          │ https://...          │ 진행    │
   │ 전통예술     │ https://...  │ https://...          │ https://...          │ 진행    │
   └────────────┴──────────────┴──────────────────────┴──────────────────────┴────────┘

   - "분야" 열의 값은 무용/미술/음악/전통예술 중 하나로 적어주세요
     (다른 표현이 들어와도 유사어는 자동 인식하려 시도합니다)
   - 링크가 아직 없는 셀은 비워두면 "준비중"으로 표시됩니다
   - "상태" 열에 "진행" 또는 "마감"을 적으면 만족도 조사 문항 버튼이
     그에 따라 열리거나 잠깁니다 (비워두면 기본값은 "진행")
   ============================================================ */
  const LINK_API_URL = 'https://script.google.com/macros/s/AKfycbyATIckZ-DIO3wxiVxXoO3l5CreV8Y4JO45eCmi0m4OHHQ993D6ed5OCd2N-pVkdEvDHg/exec';

/* ============================================================ */

  const FIELD_META = {
    '무용':  { key:'dance', color:'var(--dance)',  order:1, mark:'舞', image:'' },
    '미술':  { key:'art',   color:'var(--art)',    order:2, mark:'畵', image:'' },
    '음악':  { key:'music', color:'var(--music)',  order:3, mark:'樂', image:'' },
    '전통예술': { key:'trad', color:'var(--trad)', order:4, mark:'傳', image:'' },
  };
  // 각 분야의 실제 워크숍 사진 주소를 image 자리에 넣으면 사진이 표시됩니다.
  // (비워두면 위에 지정한 한자 마크가 있는 그라데이션 플레이스홀더가 표시됩니다.)

  const FIELD_ALIASES = {
    '무용':'무용', '발레':'무용', 'dance':'무용', 'ballet':'무용',
    '미술':'미술', '시각예술':'미술', 'art':'미술', 'visual arts':'미술',
    '음악':'음악', 'music':'음악',
    '전통예술':'전통예술', '전통':'전통예술', 'traditional arts':'전통예술', 'traditional':'전통예술',
  };

  function isOpen(raw){
    if(raw === undefined || raw === null || String(raw).trim() === '') return true; // 기본값: 진행중
    const v = String(raw).trim().toLowerCase();
    if(['마감','마감중','closed','close','종료','off','no','n'].includes(v)) return false;
    if(['오픈','진행','진행중','open','on','yes','y'].includes(v)) return true;
    return true; // 알 수 없는 값은 안전하게 진행중으로 처리
  }

  function normalizeField(raw){
    if(!raw) return null;
    const t = String(raw).trim();
    if(FIELD_ALIASES[t]) return FIELD_ALIASES[t];
    const lower = t.toLowerCase();
    if(FIELD_ALIASES[lower]) return FIELD_ALIASES[lower];
    return null;
  }

  function findCol(headers, keywords){
    for(let i=0;i<headers.length;i++){
      const h = (headers[i]||'').replace(/\s/g,'');
      if(keywords.some(k => h.includes(k))) return i;
    }
    return -1;
  }

  function renderSetupNotice(){
    const banner = document.getElementById('setupBanner');
    banner.style.display = 'block';
    banner.innerHTML =
      '아직 구글시트가 연결되지 않았습니다. 만족도조사·분석보고서 링크를 정리한 구글시트를 만드신 뒤, ' +
      '이 파일 상단 <code>SHEET_ID</code> 값에 시트 ID를 넣어주세요. (지금은 예시 데이터로 화면을 보여드립니다)';
  }

  function demoData(){
    return {
      '무용':   { survey:'', report:'', open:true },
      '미술':   { survey:'', report:'', open:true },
      '음악':   { survey:'', report:'', open:true },
      '전통예술': { survey:'', report:'', open:true },
    };
  }

  function linkBtn(label, url, isPrimary){
    if(!url){
      return `<span class="link-btn disabled"><span>${label}</span><span class="arrow">준비중</span></span>`;
    }
    const cls = isPrimary ? 'link-btn' : 'link-btn secondary';
    return `<a class="${cls}" href="${url}" target="_blank" rel="noopener">
      <span>${label}</span><span class="arrow">→</span>
    </a>`;
  }

  function surveyBtn(fieldName, url, open){
    if(!url){
      return `<span class="link-btn disabled"><span>만족도 조사 문항</span><span class="arrow">준비중</span></span>`;
    }
    const statusPill = `<span class="status-pill ${open ? 'is-open' : 'is-closed'}">${open ? '진행중' : '마감'}</span>`;
    return `<a class="link-btn primary" href="${url}" target="_blank" rel="noopener">
      <span>만족도 조사 문항</span>${statusPill}<span class="arrow">→</span>
    </a>`;
  }

  function render(dataByField){
    const content = document.getElementById('content');
    const fields = Object.keys(FIELD_META).sort((a,b)=>FIELD_META[a].order-FIELD_META[b].order);

    content.innerHTML = `<div class="grid">${fields.map((f, i)=>{
        const meta = FIELD_META[f];
        const d = dataByField[f] || {};
        const photoInner = meta.image
          ? `<img src="${meta.image}" alt="${f} 분야">`
          : `<span class="mark">${meta.mark}</span>`;
        return `<div class="tile" style="--accent:${meta.color}">
          <div class="photo">
            ${photoInner}
            <span class="num">${String(i+1).padStart(2,'0')}</span>
            <div class="scrim"></div>
            <div class="caption">
              <h2>${f}</h2>
            </div>
          </div>
          <div class="body">
            <div class="field-name">${f} 분야</div>
            <div class="link-row">
              ${linkBtn('리플렛 보기', d.leaflet, false)}
              ${surveyBtn(f, d.survey, d.open)}
              ${linkBtn('분석보고서 보기', d.report, false)}
            </div>
          </div>
        </div>`;
      }).join('')}</div>`;

    document.getElementById('updatedWrap').innerHTML =
      `<div class="updated">마지막 갱신: ${new Date().toLocaleString('ko-KR')}</div>`;
  }

  function renderError(msg){
    document.getElementById('content').innerHTML =
      `<div class="state-msg">${msg}</div>`;
  }

  async function load(){
    try{
      const url = `${LINK_API_URL}?_=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      console.log('[디버그] Apps Script 응답:', data);

      const dataByField = {};
      Object.keys(data).forEach(rawField=>{
        const field = normalizeField(rawField);
        if(!field) return;
        const entry = data[rawField] || {};
        dataByField[field] = {
          leaflet: (entry.leaflet || '').toString().trim(),
          survey: (entry.survey || '').toString().trim(),
          report: (entry.report || '').toString().trim(),
          open: isOpen(entry.status),
          rawStatus: entry.status === undefined || entry.status === '' ? '(빈 값)' : String(entry.status),
        };
      });

      render(dataByField);
    }catch(err){
      console.error(err);
      renderError('데이터를 불러오지 못했습니다. Apps Script 웹앱 배포 상태(액세스 권한: 전체)를 확인해 주세요.');
    }
  }

  load();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 | 만족도조사 · 분석보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4E4;
    --paper:#FFFDF7;
    --teal-deep:#2C4760;
    --teal-mid:#1B4C58;
    --gold:#EFC758;
    --gold-soft:#F3D48A;
    --gold-dim:#C9A54A;
    --ink:#2C2A26;
    --ink-soft:#6B6459;

    --dance:#D897A9;
    --art:#8FB48A;
    --music:#7FA9C4;
    --trad:#C97158;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  header{
    padding:56px 24px 32px;
    text-align:center;
  }
  header .eyebrow{
    font-size:13px;
    letter-spacing:.14em;
    color:var(--gold-dim);
    font-weight:700;
    margin-bottom:10px;
  }
  header h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:clamp(24px,4vw,34px);
    color:var(--teal-deep);
    margin:0 0 10px;
  }
  header p{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
  }

  main{
    max-width:1040px;
    margin:0 auto;
    padding:0 20px 80px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  @media(max-width:720px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    position:relative;
    background:var(--paper);
    border-radius:18px;
    box-shadow:0 10px 28px rgba(44,71,96,.08);
    padding:26px 26px 24px;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:var(--accent);
  }
  .card .corner{
    position:absolute;
    top:14px; left:14px;
    width:9px; height:9px;
    background:var(--gold);
    transform:rotate(45deg);
    opacity:.85;
  }
  .card .field-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .btn-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .btn-status{
    font-size:11px;
    font-weight:700;
    letter-spacing:.02em;
    padding:3px 10px;
    border-radius:999px;
    text-transform:none;
  }
  .btn-status.is-open{
    background:rgba(62,122,52,.14);
    color:#2C5A26;
  }
  .btn-status.is-closed{
    background:rgba(165,67,47,.14);
    color:#7A2E1C;
  }
  .card h2{
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    color:var(--teal-deep);
    margin:0 0 18px;
  }

  .link-row{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 18px;
    border-radius:999px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:var(--teal-deep);
    font-weight:700;
    font-size:14.5px;
    text-decoration:none;
    box-shadow:0 4px 10px rgba(239,199,88,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 14px rgba(239,199,88,.45);
  }
  .link-btn.secondary{
    background:var(--paper);
    border:1.5px solid var(--teal-deep);
    color:var(--teal-deep);
    box-shadow:none;
  }
  .link-btn.secondary:hover{
    background:#F4F0E2;
  }
  .link-btn .arrow{
    font-size:16px;
    line-height:1;
  }
  .link-btn.disabled{
    background:#EFEAE0;
    color:var(--ink-soft);
    box-shadow:none;
    cursor:default;
    pointer-events:none;
    opacity:.75;
  }

  .updated{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    margin-top:36px;
  }

  .setup-banner{
    max-width:1040px;
    margin:0 auto 28px;
    padding:16px 20px;
    background:#FFF3D6;
    border:1px solid var(--gold-dim);
    border-radius:12px;
    color:#6B4E1E;
    font-size:13.5px;
    line-height:1.6;
  }
  .setup-banner code{
    background:rgba(0,0,0,.06);
    padding:1px 6px;
    border-radius:4px;
    font-size:12.5px;
  }

  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">K-ARTS GIFTED PROJECT 2026</div>
  <h1>K예술영재 프로젝트</h1>
  <p>분야를 선택해 리플렛, 만족도 조사와 분석보고서를 확인하세요</p>
</header>

<main>
  <div id="setupBanner" class="setup-banner" style="display:none;"></div>
  <div id="content">
    <div class="state-msg">불러오는 중…</div>
  </div>
  <div id="updatedWrap"></div>
</main>

<script>
/* ============================================================
   설정 (CONFIG)
   Apps Script 웹앱 주소로 "조사 링크" 탭 데이터를 가져옵니다.
   (시트: K예술영재 프로젝트_워크숍 만족도 조사)

   시트 형식 ("조사 링크" 탭, 첫 행은 헤더):
   ┌────────────┬──────────────┬──────────────────────┬──────────────────────┬────────┐
   │ 분야        │ 리플렛 링크    │ 만족도조사 링크        │ 분석보고서 링크         │ 상태    │
   ├────────────┼──────────────┼──────────────────────┼──────────────────────┼────────┤
   │ 무용        │ https://...  │ https://...          │ https://...          │ 진행    │
   │ 미술        │ https://...  │ https://...          │ https://...          │ 마감    │
   │ 음악        │ https://...  │ https://...          │ https://...          │ 진행    │
   │ 전통예술     │ https://...  │ https://...          │ https://...          │ 진행    │
   └────────────┴──────────────┴──────────────────────┴──────────────────────┴────────┘

   - "분야" 열의 값은 무용/미술/음악/전통예술 중 하나로 적어주세요
     (다른 표현이 들어와도 유사어는 자동 인식하려 시도합니다)
   - 링크가 아직 없는 셀은 비워두면 "준비중"으로 표시됩니다
   - "상태" 열에 "진행" 또는 "마감"을 적으면 만족도 조사 문항 버튼이
     그에 따라 열리거나 잠깁니다 (비워두면 기본값은 "진행")
   ============================================================ */
  const LINK_API_URL = 'https://script.google.com/macros/s/AKfycbyATIckZ-DIO3wxiVxXoO3l5CreV8Y4JO45eCmi0m4OHHQ993D6ed5OCd2N-pVkdEvDHg/exec';

/* ============================================================ */

  const FIELD_META = {
    '무용':  { key:'dance', color:'var(--dance)',  order:1 },
    '미술':  { key:'art',   color:'var(--art)',    order:2 },
    '음악':  { key:'music', color:'var(--music)',  order:3 },
    '전통예술': { key:'trad', color:'var(--trad)', order:4 },
  };

  const FIELD_ALIASES = {
    '무용':'무용', '발레':'무용', 'dance':'무용', 'ballet':'무용',
    '미술':'미술', '시각예술':'미술', 'art':'미술', 'visual arts':'미술',
    '음악':'음악', 'music':'음악',
    '전통예술':'전통예술', '전통':'전통예술', 'traditional arts':'전통예술', 'traditional':'전통예술',
  };

  function isOpen(raw){
    if(raw === undefined || raw === null || String(raw).trim() === '') return true; // 기본값: 진행중
    const v = String(raw).trim().toLowerCase();
    if(['마감','마감중','closed','close','종료','off','no','n'].includes(v)) return false;
    if(['오픈','진행','진행중','open','on','yes','y'].includes(v)) return true;
    return true; // 알 수 없는 값은 안전하게 진행중으로 처리
  }

  function normalizeField(raw){
    if(!raw) return null;
    const t = String(raw).trim();
    if(FIELD_ALIASES[t]) return FIELD_ALIASES[t];
    const lower = t.toLowerCase();
    if(FIELD_ALIASES[lower]) return FIELD_ALIASES[lower];
    return null;
  }

  function findCol(headers, keywords){
    for(let i=0;i<headers.length;i++){
      const h = (headers[i]||'').replace(/\s/g,'');
      if(keywords.some(k => h.includes(k))) return i;
    }
    return -1;
  }

  function renderSetupNotice(){
    const banner = document.getElementById('setupBanner');
    banner.style.display = 'block';
    banner.innerHTML =
      '아직 구글시트가 연결되지 않았습니다. 만족도조사·분석보고서 링크를 정리한 구글시트를 만드신 뒤, ' +
      '이 파일 상단 <code>SHEET_ID</code> 값에 시트 ID를 넣어주세요. (지금은 예시 데이터로 화면을 보여드립니다)';
  }

  function demoData(){
    return {
      '무용':   { survey:'', report:'', open:true },
      '미술':   { survey:'', report:'', open:true },
      '음악':   { survey:'', report:'', open:true },
      '전통예술': { survey:'', report:'', open:true },
    };
  }

  function linkBtn(label, url, isPrimary){
    if(!url){
      return `<span class="link-btn disabled"><span>${label}</span><span class="arrow">준비중</span></span>`;
    }
    const cls = isPrimary ? 'link-btn' : 'link-btn secondary';
    return `<a class="${cls}" href="${url}" target="_blank" rel="noopener">
      <span>${label}</span><span class="arrow">→</span>
    </a>`;
  }

  function surveyBtn(fieldName, url, open){
    if(!url){
      return `<span class="link-btn disabled"><span>만족도 조사 문항</span><span class="arrow">준비중</span></span>`;
    }
    const statusTag = `<span class="btn-status ${open ? 'is-open' : 'is-closed'}">${open ? '진행중' : '마감'}</span>`;
    return `<a class="link-btn" href="${url}" target="_blank" rel="noopener">
      <span>만족도 조사 문항</span>
      <span class="btn-right">${statusTag}<span class="arrow">→</span></span>
    </a>`;
  }

  function render(dataByField){
    const content = document.getElementById('content');
    const fields = Object.keys(FIELD_META).sort((a,b)=>FIELD_META[a].order-FIELD_META[b].order);

    content.innerHTML = `<div class="grid">
      ${fields.map(f=>{
        const meta = FIELD_META[f];
        const d = dataByField[f] || {};
        return `<div class="card" style="--accent:${meta.color}">
          <div class="corner"></div>
          <div class="field-label">${f}</div>
          <h2>${f} 분야</h2>
          <div class="link-row">
            ${linkBtn('리플렛 보기', d.leaflet, false)}
            ${surveyBtn(f, d.survey, d.open)}
            ${linkBtn('분석보고서 보기', d.report, false)}
          </div>
        </div>`;
      }).join('')}
    </div>`;

    document.getElementById('updatedWrap').innerHTML =
      `<div class="updated">마지막 갱신: ${new Date().toLocaleString('ko-KR')}</div>`;
  }

  function renderError(msg){
    document.getElementById('content').innerHTML =
      `<div class="state-msg">${msg}</div>`;
  }

  async function load(){
    try{
      const url = `${LINK_API_URL}?_=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      console.log('[디버그] Apps Script 응답:', data);

      const dataByField = {};
      Object.keys(data).forEach(rawField=>{
        const field = normalizeField(rawField);
        if(!field) return;
        const entry = data[rawField] || {};
        dataByField[field] = {
          leaflet: (entry.leaflet || '').toString().trim(),
          survey: (entry.survey || '').toString().trim(),
          report: (entry.report || '').toString().trim(),
          open: isOpen(entry.status),
          rawStatus: entry.status === undefined || entry.status === '' ? '(빈 값)' : String(entry.status),
        };
      });

      render(dataByField);
    }catch(err){
      console.error(err);
      renderError('데이터를 불러오지 못했습니다. Apps Script 웹앱 배포 상태(액세스 권한: 전체)를 확인해 주세요.');
    }
  }

  load();
</script>

</body>
</html>

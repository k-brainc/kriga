<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 | 만족도조사 · 분석보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#14171D;
    --surface:#1D212B;
    --text:#EDE7D8;
    --text-soft:#B7AF9C;
    --text-faint:#7C7669;
    --brass:#D4AF5A;
    --brass-deep:#E9C97E;
    --line:#2B303B;

    --dance:#E08AA6;
    --art:#7FC17A;
    --music:#7FB0DD;
    --trad:#E08A5E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    color:var(--text);
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  .layout{
    max-width:1280px;
    margin:0 auto;
    padding:64px 24px 100px;
    display:grid;
    grid-template-columns:440px 1fr;
    gap:48px;
    align-items:start;
  }
  @media(max-width:860px){
    .layout{ grid-template-columns:1fr; gap:8px; }
  }

  header{
    position:sticky;
    top:48px;
  }
  header .kicker{
    font-size:13.5px;
    color:var(--text-faint);
    margin-bottom:18px;
  }
  header h1{
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-weight:800;
    font-size:clamp(56px,6.3vw,78px);
    line-height:1.2;
    color:var(--text);
    margin:0;
  }
  header p{
    color:var(--text-soft);
    font-size:15px;
    line-height:1.7;
    margin:32px 0 0;
    max-width:34ch;
  }
  header .rule{
    display:none;
  }
  @media(max-width:860px){
    header{ position:static; padding-bottom:32px; border-bottom:1px solid var(--line); margin-bottom:32px; }
    header p{ max-width:52ch; }
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:32px 28px;
    align-items:start;
  }
  @media(max-width:1080px){
    .grid{ grid-template-columns:1fr; }
  }

  .tile{
    background:var(--surface);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 32px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tile:hover{
    transform:translateY(-3px);
    box-shadow:0 4px 12px rgba(0,0,0,.35), 0 22px 44px rgba(0,0,0,.5);
  }

  .tile .photo{
    position:relative;
    aspect-ratio:4/3;
    background:
      radial-gradient(120% 140% at 15% 0%, color-mix(in srgb, var(--accent) 55%, white) 0%, transparent 55%),
      linear-gradient(150deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, #0C0E12) 100%);
    overflow:hidden;
  }
  .tile .photo img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:grayscale(0.85) contrast(1.05) brightness(0.85);
  }
  .tile .photo .tint{
    position:absolute; inset:0;
    background:var(--accent);
    mix-blend-mode:color;
    opacity:.9;
  }
  .tile .photo .tint::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(150deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 100%);
    mix-blend-mode:multiply;
  }
  .tile .photo .mark{
    position:absolute;
    right:18px; bottom:12px;
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-size:76px;
    line-height:1;
    color:rgba(255,255,255,.22);
    user-select:none;
  }
  .tile .photo .num{
    position:absolute;
    top:16px; left:18px;
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-size:14px;
    color:rgba(255,255,255,.85);
  }
  .tile .photo .scrim{
    position:absolute; left:0; right:0; bottom:0;
    height:60%;
    background:linear-gradient(180deg, transparent, rgba(15,20,30,.62));
  }
  .tile .photo .caption{
    position:absolute;
    left:18px; right:18px; bottom:14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
  }
  .tile .photo h2{
    font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
    font-weight:600;
    font-size:23px;
    color:#fff;
    margin:0;
  }
  .leaflet-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.4);
    backdrop-filter:blur(3px);
    color:#fff;
    font-weight:600;
    font-size:12.5px;
    text-decoration:none;
    transition:background .15s ease;
    white-space:nowrap;
  }
  .leaflet-btn:hover{
    background:rgba(255,255,255,.3);
  }
  .leaflet-btn.disabled{
    color:rgba(255,255,255,.5);
    border-color:rgba(255,255,255,.22);
    cursor:default;
    pointer-events:none;
  }

  .tile .body{
    padding:18px 20px 22px;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:600;
    padding:3px 10px 3px 8px;
    border-radius:999px;
    background:rgba(0,0,0,.08);
    color:var(--surface);
  }
  .status-pill::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
  }
  .status-pill.is-open::before{ background:#3E8A2E; }
  .status-pill.is-closed::before{ background:#B8492B; }

  .link-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .link-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .link-btn:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--surface);
  }
  .link-btn.primary{
    background:var(--text);
    border-color:var(--text);
    color:var(--surface);
  }
  .link-btn.primary:hover{
    background:var(--accent);
    border-color:var(--accent);
  }
  .link-btn .arrow{
    font-size:13px;
    line-height:1;
  }
  .link-btn.disabled{
    color:var(--text-faint);
    background:transparent;
    border:1px dashed var(--line);
    cursor:default;
    pointer-events:none;
  }

  .docs{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .docs-title{
    font-size:12.5px;
    color:var(--text-faint);
    margin:0 0 8px;
  }
  .doc-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 0;
  }
  .doc-row + .doc-row{
    border-top:1px solid rgba(255,255,255,.05);
  }
  .doc-name{
    flex:1;
    min-width:0;
    font-size:13.5px;
    line-height:1.4;
    color:var(--text-soft);
  }
  .doc-actions{
    display:flex;
    gap:6px;
    flex:none;
  }
  .doc-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 11px;
    border-radius:7px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-soft);
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .doc-btn:hover,
  .doc-btn:focus-visible{
    border-color:var(--accent);
    color:var(--accent);
  }
  .doc-btn.download{
    background:rgba(255,255,255,.05);
    color:var(--text);
  }
  .doc-btn.download:hover,
  .doc-btn.download:focus-visible{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--surface);
  }
  .doc-btn .ico{
    font-size:11px;
    line-height:1;
  }
  .doc-row.is-empty .doc-name{ color:var(--text-faint); }
  .doc-row.is-empty .doc-btn{
    border-style:dashed;
    color:var(--text-faint);
    background:transparent;
    pointer-events:none;
  }
  @media(max-width:340px){
    .doc-row{ flex-wrap:wrap; gap:6px; }
    .doc-name{ flex:1 0 100%; }
  }

  .updated{
    text-align:right;
    color:var(--text-faint);
    font-size:12.5px;
    margin-top:32px;
  }

  .setup-banner{
    margin:0 0 28px;
    padding:16px 20px;
    background:#3A3120;
    border:1px solid var(--brass);
    border-radius:4px;
    color:var(--brass-deep);
    font-size:13.5px;
    line-height:1.6;
  }
  .setup-banner code{
    background:rgba(0,0,0,.06);
    padding:1px 6px;
    border-radius:4px;
    font-size:12.5px;
  }

  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
    font-size:14px;
  }

  @media(max-width:560px){
    .row{ grid-template-columns:1fr; gap:8px; }
    .row .num{ padding-top:0; }
  }
</style>
</head>
<body>

<div class="layout">
<header>
  <div class="kicker">K-Arts Gifted Project · 2026</div>
  <h1>K예술영재<br>프로젝트</h1>
  <p>분야별 만족도 조사 문항에 참여하고, 리플렛과 만족도 조사 분석 보고서를 PDF로 내려받을 수 있습니다.</p>
  <div class="rule"></div>
</header>

<main>
  <div id="setupBanner" class="setup-banner" style="display:none;"></div>
  <div id="content">
    <div class="state-msg">불러오는 중…</div>
  </div>
  <div id="updatedWrap"></div>
</main>
</div>

<script>
/* ============================================================
   설정 (CONFIG)
   Apps Script 웹앱 주소로 "조사 링크" 탭 데이터를 가져옵니다.
   (시트: K예술영재 프로젝트_워크숍 만족도 조사)

   시트 형식 ("조사 링크" 탭, 첫 행은 헤더):
   ┌────────────┬──────────────┬──────────────────────┬──────────────────────┬────────┐
   │ 분야        │ 리플렛 링크    │ 만족도조사 링크        │ 분석보고서 링크         │ 상태    │
   ├────────────┼──────────────┼──────────────────────┼──────────────────────┼────────┤
   │ 무용        │ https://...  │ https://...          │ https://...          │ 진행    │
   │ 미술        │ https://...  │ https://...          │ https://...          │ 마감    │
   │ 음악        │ https://...  │ https://...          │ https://...          │ 진행    │
   │ 전통예술     │ https://...  │ https://...          │ https://...          │ 진행    │
   └────────────┴──────────────┴──────────────────────┴──────────────────────┴────────┘

   - "분야" 열의 값은 무용/미술/음악/전통예술 중 하나로 적어주세요
     (다른 표현이 들어와도 유사어는 자동 인식하려 시도합니다)
   - 링크가 아직 없는 셀은 비워두면 "준비중"으로 표시됩니다
   - "상태" 열에 "진행" 또는 "마감"을 적으면 만족도 조사 문항 버튼이
     그에 따라 열리거나 잠깁니다 (비워두면 기본값은 "진행")
   ============================================================ */
  const LINK_API_URL = 'https://script.google.com/macros/s/AKfycbyATIckZ-DIO3wxiVxXoO3l5CreV8Y4JO45eCmi0m4OHHQ993D6ed5OCd2N-pVkdEvDHg/exec';

/* ============================================================ */

  const FIELD_META = {
    '무용':  { key:'dance', color:'var(--dance)',  order:1, mark:'舞', image:'https://k-brainc.github.io/kriga/img/b.webp' },
    '미술':  { key:'art',   color:'var(--art)',    order:2, mark:'畵', image:'https://k-brainc.github.io/kriga/img/a.jpg' },
    '음악':  { key:'music', color:'var(--music)',  order:3, mark:'樂', image:'https://k-brainc.github.io/kriga/img/m.jpg' },
    '전통예술': { key:'trad', color:'var(--trad)', order:4, mark:'傳', image:'https://k-brainc.github.io/kriga/img/t.webp' },
  };
  // 각 분야의 실제 워크숍 사진 주소를 image 자리에 넣으면 사진이 표시됩니다.
  // (비워두면 위에 지정한 한자 마크가 있는 그라데이션 플레이스홀더가 표시됩니다.)

/* ============================================================
   분야별 자료 파일 (구글 드라이브)
   - 여기에 적은 링크가 각 분야 카드의 "자료" 목록에 표시됩니다.
   - 구글 드라이브 공유 링크(https://drive.google.com/file/d/.../view)를
     그대로 붙여넣으면 [보기]와 [다운로드] 버튼이 자동으로 만들어집니다.
   - type:'leaflet' 로 표시한 항목이 카드 사진 위 "리플렛 보기" 버튼이 됩니다.
   - type:'report' 항목은 구글시트의 "분석보고서 링크" 값이 있으면 그 값이 우선합니다.
   ============================================================ */
  const FIELD_DOCS = {
    '무용': [
      { label:'리플렛', type:'leaflet',
        url:'https://drive.google.com/file/d/14NkDIaKCOnEvOv0ZapOYobRwiRLCgbUn/view?usp=sharing' },
      { label:'만족도 조사 분석 보고서', type:'report',
        url:'https://drive.google.com/file/d/1NkOKKWRjnKESPyCF5gxJEHGGDI6oSJzb/view?usp=sharing' },
    ],
    '미술': [
      { label:'리플렛', type:'leaflet',
        url:'https://drive.google.com/file/d/1Al1Do0ng8LqXtPxx_YpxKWiX7x-MwHiu/view?usp=sharing' },
      { label:'만족도 조사 분석 보고서', type:'report',
        url:'https://drive.google.com/file/d/1tM_O3wf1XOUernl9tBMEtCS9JbBkpc42/view?usp=sharing' },
    ],
    '음악': [
      { label:'리플렛', type:'leaflet',
        url:'https://drive.google.com/file/d/1Uqj0GWgrQyHuJlO-sloi_R54MTQcDPsp/view?usp=sharing' },
      { label:'마스터클래스 안내지', type:'doc',
        url:'https://drive.google.com/file/d/1_zXAlnpoKqUhDXFwWChFc-Zbk-706h3B/view?usp=sharing' },
      { label:'연주회 안내지', type:'doc',
        url:'https://drive.google.com/file/d/1ZNlxJr_31me-RnpvMgB7-cW1-55vakYT/view?usp=sharing' },
      { label:'만족도 조사 분석 보고서', type:'report',
        url:'https://drive.google.com/file/d/1DWH01hbmnI6Q5_csZejIX8OytWyKLQeX/view?usp=sharing' },
    ],
    '전통예술': [
      { label:'리플렛', type:'leaflet',
        url:'https://drive.google.com/file/d/1_e6n1CtpSQiCdyLDXufNpcAALEvSw6ZT/view?usp=sharing' },
      { label:'만족도 조사 분석 보고서', type:'report',
        url:'https://drive.google.com/file/d/1sdaGmI84anC8sR43WvQK_x8KNJ5NuZwv/view?usp=sharing' },
    ],
  };

  const FIELD_ALIASES = {
    '무용':'무용', '발레':'무용', 'dance':'무용', 'ballet':'무용',
    '미술':'미술', '시각예술':'미술', 'art':'미술', 'visual arts':'미술',
    '음악':'음악', 'music':'음악',
    '전통예술':'전통예술', '전통':'전통예술', 'traditional arts':'전통예술', 'traditional':'전통예술',
  };

  function isOpen(raw){
    if(raw === undefined || raw === null || String(raw).trim() === '') return true; // 기본값: 진행중
    const v = String(raw).trim().toLowerCase();
    if(['마감','마감중','closed','close','종료','off','no','n'].includes(v)) return false;
    if(['오픈','진행','진행중','open','on','yes','y'].includes(v)) return true;
    return true; // 알 수 없는 값은 안전하게 진행중으로 처리
  }

  function normalizeField(raw){
    if(!raw) return null;
    const t = String(raw).trim();
    if(FIELD_ALIASES[t]) return FIELD_ALIASES[t];
    const lower = t.toLowerCase();
    if(FIELD_ALIASES[lower]) return FIELD_ALIASES[lower];
    return null;
  }

  function findCol(headers, keywords){
    for(let i=0;i<headers.length;i++){
      const h = (headers[i]||'').replace(/\s/g,'');
      if(keywords.some(k => h.includes(k))) return i;
    }
    return -1;
  }

  function renderSetupNotice(){
    const banner = document.getElementById('setupBanner');
    banner.style.display = 'block';
    banner.innerHTML =
      '아직 구글시트가 연결되지 않았습니다. 만족도조사·분석보고서 링크를 정리한 구글시트를 만드신 뒤, ' +
      '이 파일 상단 <code>SHEET_ID</code> 값에 시트 ID를 넣어주세요. (지금은 예시 데이터로 화면을 보여드립니다)';
  }

  function demoData(){
    return {
      '무용':   { survey:'', report:'', open:true },
      '미술':   { survey:'', report:'', open:true },
      '음악':   { survey:'', report:'', open:true },
      '전통예술': { survey:'', report:'', open:true },
    };
  }

  /* 구글 드라이브 공유 링크에서 파일 ID를 뽑아냅니다. */
  function driveFileId(url){
    if(!url) return null;
    const m = String(url).match(/\/file\/d\/([-\w]{20,})/)
           || String(url).match(/[?&]id=([-\w]{20,})/);
    return m ? m[1] : null;
  }

  function viewUrl(url){
    const id = driveFileId(url);
    return id ? `https://drive.google.com/file/d/${id}/view` : url;
  }

  function downloadUrl(url){
    const id = driveFileId(url);
    return id ? `https://drive.google.com/uc?export=download&id=${id}` : null;
  }

  /* 분야별 자료 목록을 구글시트 값과 합칩니다.
     시트에 링크가 들어오면 같은 종류(리플렛/분석보고서)의 기본값을 덮어씁니다. */
  function docsFor(field, d){
    const base = (FIELD_DOCS[field] || []).map(doc => ({...doc}));
    const override = (type, url) => {
      if(!url) return;
      const hit = base.find(doc => doc.type === type);
      if(hit) hit.url = url;
      else base.push({ label: type === 'leaflet' ? '리플렛' : '만족도 조사 분석 보고서', type, url });
    };
    override('leaflet', d.leaflet);
    override('report', d.report);
    return base;
  }

  function docRow(doc){
    if(!doc.url){
      return `<div class="doc-row is-empty">
        <div class="doc-name">${doc.label}</div>
        <div class="doc-actions"><span class="doc-btn">준비중</span></div>
      </div>`;
    }
    const dl = downloadUrl(doc.url);
    const dlBtn = dl
      ? `<a class="doc-btn download" href="${dl}" rel="noopener"><span class="ico">↓</span><span>다운로드</span></a>`
      : '';
    return `<div class="doc-row">
      <div class="doc-name">${doc.label}</div>
      <div class="doc-actions">
        <a class="doc-btn" href="${viewUrl(doc.url)}" target="_blank" rel="noopener">보기</a>
        ${dlBtn}
      </div>
    </div>`;
  }

  function docsBlock(field, d){
    const docs = docsFor(field, d);
    if(!docs.length) return '';
    return `<div class="docs">
      <p class="docs-title">자료 (PDF)</p>
      ${docs.map(docRow).join('')}
    </div>`;
  }

  function surveyBtn(fieldName, url, open){
    if(!url){
      return `<span class="link-btn disabled"><span>만족도 조사 문항</span><span class="arrow">준비중</span></span>`;
    }
    const statusPill = `<span class="status-pill ${open ? 'is-open' : 'is-closed'}">${open ? '진행중' : '마감'}</span>`;
    return `<a class="link-btn primary" href="${url}" target="_blank" rel="noopener">
      <span>만족도 조사 문항</span>${statusPill}<span class="arrow">→</span>
    </a>`;
  }

  function leafletBtn(url){
    if(!url){
      return `<span class="leaflet-btn disabled"><span>리플렛</span></span>`;
    }
    return `<a class="leaflet-btn" href="${viewUrl(url)}" target="_blank" rel="noopener">
      <span>리플렛 보기</span><span class="arrow">→</span>
    </a>`;
  }

  function render(dataByField){
    const content = document.getElementById('content');
    const fields = Object.keys(FIELD_META).sort((a,b)=>FIELD_META[a].order-FIELD_META[b].order);

    content.innerHTML = `<div class="grid">${fields.map((f, i)=>{
        const meta = FIELD_META[f];
        const d = dataByField[f] || {};
        const docs = docsFor(f, d);
        const leafletDoc = docs.find(doc => doc.type === 'leaflet');
        const photoInner = meta.image
          ? `<img src="${meta.image}" alt="${f} 분야"><div class="tint"></div>`
          : `<span class="mark">${meta.mark}</span>`;
        return `<div class="tile" style="--accent:${meta.color}">
          <div class="photo">
            ${photoInner}
            <span class="num">${String(i+1).padStart(2,'0')}</span>
            <div class="scrim"></div>
            <div class="caption">
              <h2>${f}</h2>
              ${leafletBtn(leafletDoc && leafletDoc.url)}
            </div>
          </div>
          <div class="body">
            <div class="link-row">
              ${surveyBtn(f, d.survey, d.open)}
            </div>
            ${docsBlock(f, d)}
          </div>
        </div>`;
      }).join('')}</div>`;

    document.getElementById('updatedWrap').innerHTML =
      `<div class="updated">마지막 갱신: ${new Date().toLocaleString('ko-KR')}</div>`;
  }

  async function load(){
    try{
      const url = `${LINK_API_URL}?_=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      console.log('[디버그] Apps Script 응답:', data);

      const dataByField = {};
      Object.keys(data).forEach(rawField=>{
        const field = normalizeField(rawField);
        if(!field) return;
        const entry = data[rawField] || {};
        dataByField[field] = {
          leaflet: (entry.leaflet || '').toString().trim(),
          survey: (entry.survey || '').toString().trim(),
          report: (entry.report || '').toString().trim(),
          open: isOpen(entry.status),
          rawStatus: entry.status === undefined || entry.status === '' ? '(빈 값)' : String(entry.status),
        };
      });

      render(dataByField);
    }catch(err){
      console.error(err);
      // 시트를 못 불러와도 아래에 등록해 둔 리플렛·보고서 파일은 그대로 보여줍니다.
      render({});
      const banner = document.getElementById('setupBanner');
      banner.style.display = 'block';
      banner.textContent = '만족도 조사 문항 링크를 불러오지 못했습니다. Apps Script 웹앱 배포 상태(액세스 권한: 전체)를 확인해 주세요. 리플렛과 분석 보고서는 정상적으로 내려받을 수 있습니다.';
    }
  }

  load();
</script>

</body>
</html>

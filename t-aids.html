<style>
  :root{
    --teal-deep:#2C4760;
    --cream:#FBF4E4;
    --paper:#FFFDF7;
    --gold:#EFC758;
    --gold-soft:#F3D48A;
    --gold-dim: rgba(231,185,92,0.18);
    --ink:#16282C;
    --ink-soft:#3C5257;
    --serif: 'Noto Serif KR', serif;
    --sans: 'Noto Sans KR', sans-serif;
    --shadow: 0 18px 40px -18px rgba(18,58,68,0.35);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; font-family:var(--sans); color:var(--ink); background:var(--cream);
    -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word;
  }
  a{color:inherit;}

  .wrap{ max-width:560px; margin:0 auto; min-height:100vh; }

  /* ---- header (matches inner-page brand header) ---- */
  .head{
    background:var(--teal-deep); padding:26px 22px 20px; text-align:center;
  }
  .head-title img{ height:26px; width:auto; display:block; margin:0 auto; }
  .head-sub{
    font-family:var(--serif); font-weight:500; font-size:14.5px;
    color:rgba(251,244,228,0.75); margin-top:10px;
  }
  .head-rule{
    display:flex; align-items:center; gap:10px; margin:18px 0 0;
  }
  .head-rule::before, .head-rule::after{
    content:""; flex:1; height:1px; background:rgba(251,244,228,0.25);
  }
  .head-rule span{
    font-family:var(--serif); font-weight:700; font-size:13.5px; color:var(--teal-deep);
    background:var(--gold-soft); padding:6px 16px; border-radius:999px; letter-spacing:0.02em;
    white-space:nowrap;
  }

  .body{ padding:26px 22px 48px; }

  .eyebrow{
    font-family:var(--serif); font-weight:700; font-size:13px; letter-spacing:0.04em;
    color:var(--teal-deep); text-transform:uppercase; margin-bottom:6px;
  }
  h1.subject{
    font-family:var(--serif); font-weight:800; font-size:22px; color:var(--teal-deep);
    line-height:1.4; margin:0 0 22px; text-align:center;
  }
  h1.subject b{ color:var(--ink); }

  .notice-card{
    background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px; margin-bottom:20px;
  }
  .notice-card p.lead{
    font-size:14.5px; line-height:1.75; color:var(--ink-soft); margin:0 0 18px;
  }
  .rule-list{ list-style:none; margin:0; padding:0; }
  .rule-list li{
    display:flex; gap:12px; align-items:flex-start;
    padding:14px 0; border-top:1px solid rgba(18,58,68,0.08);
  }
  .rule-list li:first-child{ border-top:none; padding-top:0; }
  .rule-num{
    flex:none; width:26px; height:26px; border-radius:50%;
    background:var(--teal-deep); color:var(--gold-soft);
    font-family:var(--serif); font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .rule-text{ font-size:15px; line-height:1.65; color:var(--ink); padding-top:2px; }
  .rule-text .skip{ color:#B5473F; font-weight:700; }
  .rule-text .must{ color:var(--teal-deep); font-weight:700; }

  .dl-section{ text-align:center; margin-top:28px; }
  .dl-caption{
    font-size:13.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.6;
  }
  .dl-btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--gold); color:var(--teal-deep); font-weight:800; font-size:16.5px;
    padding:15px 30px; border-radius:999px; text-decoration:none;
    box-shadow:0 12px 26px -10px rgba(231,185,92,0.75);
  }
  .dl-btn .arrow{ font-size:18px; }
  .dl-filename{
    margin-top:12px; font-size:12.5px; color:var(--ink-soft); opacity:0.8;
  }

  .footer-note{
    margin-top:34px; text-align:center; font-size:12.5px; color:var(--ink-soft); opacity:0.75;
    line-height:1.7;
  }
</style>
